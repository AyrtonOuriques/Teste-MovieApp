version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py createsuperuser --noinput || true &&
        gunicorn MovieAppAPI.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "